<index.html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hairme Up</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Jost:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f5e9e4;
    --card: #fffaf7;
    --ink: #3a2a2e;
    --ink-soft: #7a6266;
    --gold: #b5895a;
    --line: #e3cfc6;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #241b1d;
      --card: #2f2325;
      --ink: #f3e8e4;
      --ink-soft: #c9b3b0;
      --gold: #d9ac78;
      --line: #4a3a3c;
    }
  }
  :root[data-theme="dark"] {
    --bg: #241b1d;
    --card: #2f2325;
    --ink: #f3e8e4;
    --ink-soft: #c9b3b0;
    --gold: #d9ac78;
    --line: #4a3a3c;
  }

  * { box-sizing: border-box; }

  html {
    scroll-padding-top: env(safe-area-inset-top, 0px);
  }

  html, body {
    height: 100%;
  }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: 'Jost', Arial, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: max(32px, env(safe-area-inset-top, 0px)) 20px max(32px, env(safe-area-inset-bottom, 0px));
  }

  .card {
    width: 100%;
    max-width: 380px;
    text-align: center;
  }

  .mark {
    width: 56px;
    height: 56px;
    margin: 0 auto 20px;
    border-radius: 50%;
    border: 1px solid var(--gold);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Cormorant Garamond', serif;
    font-size: 26px;
    font-style: italic;
    color: var(--gold);
  }

  h1 {
    font-family: 'Cormorant Garamond', serif;
    font-weight: 600;
    font-size: clamp(34px, 8vw, 46px);
    letter-spacing: 0.5px;
    margin: 0 0 6px;
  }

  .tag {
    font-size: 13px;
    color: var(--ink-soft);
    letter-spacing: 0.06em;
    margin: 0 0 40px;
  }

  .links {
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .link-box {
    display: flex;
    align-items: center;
    gap: 14px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 16px 20px;
    text-decoration: none;
    color: var(--ink);
    transition: transform 0.15s ease, border-color 0.15s ease;
  }

  .link-box:hover {
    transform: translateY(-2px);
    border-color: var(--gold);
  }

  .link-box:focus-visible {
    outline: 2px solid var(--gold);
    outline-offset: 2px;
  }

  .icon {
    width: 22px;
    height: 22px;
    flex: none;
    color: var(--gold);
  }

  .icon svg { width: 100%; height: 100%; display: block; }

  .label-group { text-align: left; }

  .label {
    font-size: 16px;
    display: block;
  }

  .handle {
    font-size: 12.5px;
    color: var(--ink-soft);
    display: block;
    margin-top: 2px;
  }

  footer {
    margin-top: 40px;
    font-size: 11.5px;
    color: var(--ink-soft);
  }
</style>
</head>
<body>
  <div class="card">
    <div class="mark">H</div>
    <h1>Hairme Up</h1>
    <p class="tag">salón de belleza</p>

    <div class="links">
      <a class="link-box" href="#">
        <span class="icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.2" cy="6.8" r="1"/></svg>
        </span>
        <span class="label-group">
          <span class="label">Instagram</span>
          <span class="handle">@hairmeup</span>
        </span>
      </a>

      <a class="link-box" href="#">
        <span class="icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M15 8h-2c-1.1 0-2 .9-2 2v2H9v3h2v6h3v-6h2.2l.8-3H14v-1.5c0-.5.3-.8.8-.8H16V8z"/></svg>
        </span>
        <span class="label-group">
          <span class="label">Facebook</span>
          <span class="handle">/hairmeup</span>
        </span>
      </a>

      <a class="link-box" href="#">
        <span class="icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18M8 3v3M16 3v3"/></svg>
        </span>
        <span class="label-group">
          <span class="label">Agenda</span>
          <span class="handle">reserva tu cita</span>
        </span>
      </a>

      <a class="link-box" href="#">
        <span class="icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 21s-7-5.5-7-11a7 7 0 0 1 14 0c0 5.5-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/></svg>
        </span>
        <span class="label-group">
          <span class="label">Ubícanos</span>
          <span class="handle">cómo llegar</span>
        </span>
      </a>
    </div>

    <footer>Hairme Up · salón de belleza</footer>
  </div>
</body>
</html>
